# RCMS ops stack (M80q001, role=ops): RCMS + Postgres + n8n.
# Architecture v3.1 Section 6B / RCMS Technical Spec v1.6.
#
# Ports match what octava-lab-bootstrap.sh already opened in UFW for the
# ops role: 8000 (RCMS/DRF), 5432 (Postgres), 5678 (n8n). Named volumes
# land under /data/docker automatically -- the bootstrap script already
# pointed Docker's data-root at /data (the added ext4 drive).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rcms}
      POSTGRES_USER: ${POSTGRES_USER:-rcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
